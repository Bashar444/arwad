# R CMD check of the arwad package (r/) on Linux, macOS and Windows, with the
# Goose toolchain installed so that the equivalence corpus runs natively.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goose: goose-v2026.3-linux-x64.tar.gz
          - os: macos-latest
            goose: goose-v2026.3-macos-arm64.tar.gz
          - os: windows-latest
            goose: goose-v2026.3-windows-x64.zip
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install Goose v2026.3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/goose"
          cd "$RUNNER_TEMP/goose"
          curl -fsSL -o "${{ matrix.goose }}" "https://github.com/aardappel/goose/releases/download/v2026.3/${{ matrix.goose }}"
          case "${{ matrix.goose }}" in
            *.zip) unzip -q "${{ matrix.goose }}" ;;
            *) tar -xzf "${{ matrix.goose }}" ;;
          esac
          exe=$(find "$RUNNER_TEMP/goose" -type f \( -name goose -o -name goose.exe \) | head -n 1)
          chmod +x "$exe"
          "$exe" version
          echo "ARWAD_GOOSE=$exe" >> "$GITHUB_ENV"
          echo "ARWAD_TEST_CACHE=$RUNNER_TEMP/arwad-cache" >> "$GITHUB_ENV"

      - name: Keep compiled units between runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arwad-cache
          key: arwad-units-${{ runner.os }}-${{ github.sha }}
          restore-keys: arwad-units-${{ runner.os }}-

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

  # Phase 1 exit criterion: no memory errors under AddressSanitizer. Every
  # compiled unit (and the Goose runtime) is built with -fsanitize=address and
  # the whole test suite, the 201-function corpus included, runs in an R
  # process with the sanitizer runtime preloaded; the first error fails the job.
  asan:
    name: AddressSanitizer (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ARWAD_EXTRA_CFLAGS: -fsanitize=address -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::testthat
          needs: check

      - name: Install Goose v2026.3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/goose" && cd "$RUNNER_TEMP/goose"
          curl -fsSL -o goose.tar.gz "https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz"
          tar -xzf goose.tar.gz
          exe=$(find "$RUNNER_TEMP/goose" -type f -name goose | head -n 1)
          chmod +x "$exe"
          echo "ARWAD_GOOSE=$exe" >> "$GITHUB_ENV"
          echo "ARWAD_TEST_CACHE=$RUNNER_TEMP/arwad-cache" >> "$GITHUB_ENV"

      - name: Keep compiled units between runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arwad-cache
          key: arwad-asan-units-${{ github.sha }}
          restore-keys: arwad-asan-units-

      - name: Install arwad
        run: R CMD INSTALL r

      - name: Run the tests with every unit built under AddressSanitizer
        shell: bash
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          Rscript -e 'library(testthat); library(arwad); test_dir("r/tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
